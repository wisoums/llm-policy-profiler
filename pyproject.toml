[project]
name = "llm-policy-profiler"
version = "0.0.0"
description = "OpenTelemetry-native profiling for the cost, latency, quality, privacy, and security impact of LLM middleware policies."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
  "llm",
  "opentelemetry",
  "observability",
  "ai-infrastructure",
  "privacy",
  "semantic-cache",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
]

[project.optional-dependencies]
privacy = []
litellm = []
cache = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_policy_profiler"]

[dependency-groups]
dev = [
  "bandit",
  "mypy",
  "pip-audit",
  "pre-commit",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
]

[tool.uv]
required-version = ">=0.12.13,<0.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=llm_policy_profiler",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=85",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["llm_policy_profiler"]
warn_unreachable = true

[tool.bandit]
exclude_dirs = ["tests"]
