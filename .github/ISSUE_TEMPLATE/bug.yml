name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, LPP version/commit, OS, and relevant optional integrations.
  - type: textarea
    id: privacy
    attributes:
      label: Privacy note
      description: Do not paste real secrets, PII, prompts, or customer data.
