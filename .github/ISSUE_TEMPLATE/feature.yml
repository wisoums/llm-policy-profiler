name: Feature request
description: Propose a focused capability
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What engineering or user problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: telemetry
    attributes:
      label: Telemetry/privacy implications
  - type: textarea
    id: acceptance
    attributes:
      label: Proposed acceptance criteria
